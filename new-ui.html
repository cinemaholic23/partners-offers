<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Новый UI — Предложения партнёров</title>
    <link rel="stylesheet" href="assets/css/new-ui.css?v=7">
  </head>
  <body>
    <main class="page">
      <header class="header">
        <h1>Предложения партнёров</h1>
      </header>

      <section class="city-row" aria-label="Выбор города и поиск">
        <div class="city-select" aria-label="Выбранный город">
          <svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <g clip-path="url(#pinClip)">
              <path fill-rule="evenodd" clip-rule="evenodd" d="M5.572 8.782c0-3.55 2.878-6.429 6.429-6.429s6.428 2.878 6.428 6.429c0 2.169-1.147 4.124-2.568 5.704-1.413 1.571-3.025 2.69-3.787 3.176a.136.136 0 0 1-.147 0c-.762-.486-2.373-1.605-3.786-3.176-1.422-1.58-2.569-3.535-2.569-5.704ZM12.001 6.163a2.619 2.619 0 1 0 0 5.238 2.619 2.619 0 0 0 0-5.238Z" fill="currentColor"/>
              <path d="M5.333 19.258c0-.908 1.424-1.698 3.519-2.099.944.803 1.801 1.386 2.306 1.708.515.328 1.168.328 1.684 0 .505-.322 1.361-.905 2.305-1.708 2.095.401 3.519 1.191 3.519 2.099 0 1.315-2.984 2.381-6.666 2.381-3.682 0-6.667-1.066-6.667-2.381Z" fill="currentColor"/>
            </g>
            <defs>
              <clipPath id="pinClip">
                <rect width="20" height="20" fill="white" transform="translate(2 2)"/>
              </clipPath>
            </defs>
          </svg>
          <span>г. Москва</span>
        </div>

        <button class="search-button" type="button" aria-label="Поиск">
          <svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <g clip-path="url(#searchClip)">
              <path fill-rule="evenodd" clip-rule="evenodd" d="M11.103 2.141a8.796 8.796 0 0 1 6.808 14.367l3.458 3.458a1.108 1.108 0 0 1-1.567 1.567l-3.5-3.498a8.755 8.755 0 0 1-5.199 1.699 8.796 8.796 0 0 1 0-17.593Zm0 2.217a6.58 6.58 0 1 0 0 13.159 6.58 6.58 0 0 0 6.58-6.58 6.58 6.58 0 0 0-6.58-6.579Z" fill="currentColor"/>
            </g>
            <defs>
              <clipPath id="searchClip">
                <rect width="20" height="20" fill="white" transform="translate(2 2)"/>
              </clipPath>
            </defs>
          </svg>
          <span>Поиск</span>
        </button>
      </section>

      <section class="cashback-categories" aria-label="Категории кэшбэка">
        <div class="cashback-categories__viewport">
          <div class="cashback-categories__carousel" id="cashbackCategories"></div>
        </div>
      </section>

      <section class="hero-stories" id="heroStories" aria-label="Предложения партнёров"></section>

      <section class="popular-section" aria-label="Популярное">
        <h2 class="popular-section__title">Популярное</h2>
      </section>

      <section class="popular-placeholder-wrap" aria-label="Заглушка популярного">
        <div class="popular-placeholder"></div>
      </section>
    </main>

    <script src="assets/js/new-ui.js?v=9"></script>
  </body>
</html>
